# Render Blueprint Specification
# Optimized for Render Free Tier using Turso for persistence
services:
  - type: web
    name: sadu-backend
    runtime: go
    # Render automatically detects the Go version from go.mod (1.25)
    buildCommand: go build -o bin/main cmd/main.go
    startCommand: ./bin/main
    healthCheckPath: /health
    envVars:
      - key: CGO_ENABLED
        value: "1"
      - key: GIN_MODE
        value: release
      - key: PORT
        value: 8080
      - key: SECRET_KEY
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false # Set your Turso URL (libsql://...) in Render Dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false # Set your Turso Auth Token in Render Dashboard
      - key: ADMIN_USER
        sync: false # Set your Admin Username in Render Dashboard
      - key: ADMIN_PASS
        sync: false # Set your Admin Password in Render Dashboard
      - key: DATABASE_PATH
        value: "database.db" # Fallback local path (ephemeral in Free Tier)
