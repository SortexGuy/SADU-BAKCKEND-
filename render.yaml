# Render Blueprint Specification
# See https://render.com/docs/yaml-spec for more information
services:
  - type: web
    name: sadu-backend
    runtime: go
    # Render will automatically detect the Go version from go.mod (1.25)
    buildCommand: go build -o bin/main cmd/main.go
    startCommand: ./bin/main
    healthCheckPath: /health
    envVars:
      - key: CGO_ENABLED
        value: "1"
      - key: GIN_MODE
        value: release
      - key: PORT
        value: 8080
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /data/database.db
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_USER
        sync: false # Set this in Render Dashboard
      - key: ADMIN_PASS
        sync: false # Set this in Render Dashboard

    # Persistent Disk for SQLite3
    # NOTE: Persistent Disks are not available on Render's Free Tier.
    # If you are on the Free Tier, remove the 'disk' section below and set
    # 'DATABASE_PATH' to 'database.db'. Note that data will be lost on restarts.
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
